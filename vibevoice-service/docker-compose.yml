version: '3.8'

services:
  vibevoice:
    build: .
    container_name: vibevoice-service
    ports:
      - "8000:8000"
    environment:
      - VIBEVOICE_MODEL=microsoft/VibeVoice-1.5B
      - USE_QUANTIZATION=true
      - PORT=8000
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      # Cache directory for model downloads
      - model-cache:/root/.cache/huggingface
      # Optional: Mount local directory for voice prompts
      # - ./voice_prompts:/app/voice_prompts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - tts-network

  # Optional: NGINX for production deployment
  nginx:
    image: nginx:alpine
    container_name: vibevoice-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - vibevoice
    networks:
      - tts-network
    profiles:
      - production

volumes:
  model-cache:

networks:
  tts-network:
    driver: bridge